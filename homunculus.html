<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homunculus</title>
<style>
:root{color-scheme:dark light;--bg:#000;--ink:#f5f5f7;--muted:#86868b;--line:rgba(255,255,255,.12)}
@media (prefers-color-scheme:light){:root{--bg:#fbfbfd;--ink:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.12)}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow:hidden;text-align:center}
body::before{content:"";position:fixed;width:900px;height:900px;left:50%;top:50%;transform:translate(-50%,-55%);z-index:-1;
 background:radial-gradient(closest-side,rgba(41,151,255,.28),rgba(191,90,242,.16) 45%,transparent 70%);filter:blur(20px);animation:b 9s ease-in-out infinite}
@keyframes b{50%{transform:translate(-50%,-55%) scale(1.1);opacity:.8}}
main{padding:30px;max-width:560px}
svg{width:72px;height:72px;margin-bottom:18px}
h1{font-size:clamp(40px,8vw,72px);line-height:1;margin:0 0 12px;letter-spacing:-.045em;font-weight:750}
h1 b{background:linear-gradient(92deg,#2997ff,#7d7aff 45%,#bf5af2 75%,#ff375f);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);margin:0 0 28px;min-height:1.5em}
a.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 32px;border-radius:99px;font-weight:600;font-size:17px;text-decoration:none;color:#fff;
 background:linear-gradient(92deg,#2997ff,#7d7aff 50%,#bf5af2);box-shadow:0 10px 40px rgba(125,122,255,.35);transition:transform .15s}
a.btn:active{transform:scale(.97)}
.dots{display:inline-flex;gap:6px;margin-left:10px}.dots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.4;animation:d 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes d{50%{opacity:1}}
small{display:block;margin-top:26px;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
</style></head>
<body><main>
<svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2997ff"/><stop offset="1" stop-color="#bf5af2"/></linearGradient></defs><path d="M16 3l11 6.3v13.4L16 29 5 22.7V9.3z" fill="url(#g)"/><path d="M16 3v26M5 9.3l11 6.4 11-6.4" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" fill="none"/></svg>
<h1>img<b>2</b>rig</h1>
<p id="msg">Checking…</p>
<a class="btn" id="start" href="homunculus://start" hidden>Start Homunculus</a>
<a class="btn" id="open" href="http://127.0.0.1:8765/" hidden>Open Homunculus</a>
<small id="hint" hidden>The first time, your browser asks which app opens “homunculus” links: choose <b>Homunculus launcher</b> (tick “always”). It starts the local server for you.</small>
</main>
<script>
const APP = "http://127.0.0.1:8765/";
const $ = (id) => document.getElementById(id);
async function up() {
  try { const c = new AbortController(); setTimeout(() => c.abort(), 1500); await fetch(APP + "api/live", { mode: "no-cors", signal: c.signal, cache: "no-store" }); return true; }
  catch { return false; }
}
let waiting = false;
async function tick() {
  if (await up()) { $("msg").textContent = "Opening…"; location.replace(APP); return; }
  if (!waiting) { $("msg").textContent = "The local server is not running."; $("start").hidden = false; $("hint").hidden = false; }
  else { $("msg").innerHTML = "Starting<span class='dots'><i></i><i></i><i></i></span>"; }
  setTimeout(tick, 1200);
}
$("start").addEventListener("click", () => { waiting = true; $("start").hidden = true; $("hint").hidden = true; $("msg").innerHTML = "Starting<span class='dots'><i></i><i></i><i></i></span>"; });
tick();
</script></body></html>
